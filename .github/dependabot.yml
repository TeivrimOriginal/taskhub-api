version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    ignore:
      # `pydantic` pins `pydantic-core` exactly, so the two can never be upgraded
      # independently. Left alone, Dependabot opens a pull request for every
      # `pydantic-core` release that the installed `pydantic` does not accept — pip then
      # reports the result as a dependency conflict, which is a broken environment wearing
      # a green check. Bumping pydantic pulls its core along with it.
      - dependency-name: "pydantic-core"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      fastapi-stack:
        patterns:
          - "fastapi"
          - "starlette"
          - "pydantic*"
          - "uvicorn"
      database:
        patterns:
          - "sqlalchemy*"
          - "asyncpg"
          - "alembic"
          - "psycopg*"
      async-jobs:
        patterns:
          - "celery*"
          - "kombu"
          - "redis*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
      - github-actions