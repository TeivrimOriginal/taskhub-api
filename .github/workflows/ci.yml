# =====================================================================================
# CI — lint, types, tests, migrations, security and the production image.
#
# Jobs are split so a failure names the thing that broke instead of "CI failed".
# =====================================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------ static analysis
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.16.10

      - name: ruff check
        run: ruff check . --output-format=github

      - name: ruff format --check
        run: ruff format --check .

  types:
    name: Types (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install the project
        run: pip install -e ".[dev]"

      - name: mypy
        run: mypy

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------------- tests
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, types]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_POSTGRES_ASYNC_URI: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/taskhub_test
      TEST_POSTGRES_SYNC_URI: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/taskhub_test
      # The Redis *service* is reachable at 127.0.0.1; without these the cache-backed
      # tests silently skip and the Redis code paths go unmeasured.
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the project
        run: pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -U postgres; then exit 0; fi
            sleep 1
          done
          echo "PostgreSQL never became ready" && exit 1

      - name: Wait for Redis
        # `redis-cli` only exists inside the service container, not on the runner, so the
        # probe uses the client library the project already depends on.
        run: |
          python - <<'PY'
          import sys
          import time

          import redis

          client = redis.Redis(host="127.0.0.1", port=6379, socket_connect_timeout=1)
          for _ in range(30):
              try:
                  if client.ping():
                      print("redis is ready")
                      sys.exit(0)
              except redis.RedisError:
                  time.sleep(1)
          print("Redis never became ready")
          sys.exit(1)
          PY

      - name: Run the test suite
        run: pytest --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # -------------------------------------------------------------------- migrations
  migrations:
    name: Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskhub_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: testing
      SECRET_KEY: ci-secret-key-that-is-long-enough-for-ci-0123456789
      POSTGRES_ASYNC_URI: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/taskhub_ci
      POSTGRES_SYNC_URI: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/taskhub_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Upgrade, downgrade, upgrade again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models and migrations must agree
        run: alembic check

      - name: Autogenerate must find nothing to do
        run: |
          # `alembic revision --autogenerate` always writes a file; what matters is
          # whether it contains operations. An empty revision is the pass condition.
          alembic revision --autogenerate -m ci-drift-check
          revision="$(ls -t alembic/versions/*ci_drift_check*.py | head -n 1)"
          if grep -qE '^\s+op\.' "$revision"; then
            echo "::error::alembic autogenerate produced operations — commit a migration"
            sed -n '1,60p' "$revision"
            exit 1
          fi
          rm -f "$revision"
          echo "no drift"

  # ------------------------------------------------------------------- build image
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: taskhub-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image must declare a healthcheck
        run: |
          test -n "$(docker inspect --format '{{json .Config.Healthcheck}}' taskhub-api:ci)" \
            || { echo "::error::no HEALTHCHECK in the image"; exit 1; }

      - name: The image must not run as root
        run: |
          user="$(docker inspect --format '{{.Config.User}}' taskhub-api:ci)"
          test "$user" != "0" && test -n "$user" \
            || { echo "::error::the runtime image runs as root"; exit 1; }

      - name: Import smoke check inside the image
        run: |
          docker run --rm --entrypoint python taskhub-api:ci -c "import app.main; print('imports ok')"

  # ------------------------------------------------------------------- compose file
  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The compose file must be valid
        run: docker compose config --quiet