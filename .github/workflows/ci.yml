# =====================================================================================
# CI — lint, types, tests, migrations, security and the production image.
#
# Jobs are split so a failure names the thing that broke instead of "CI failed".
# =====================================================================================

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: nothing here needs to write to the repository. A job that
# does asks for more explicitly, which is easier to review than a workflow-wide grant.
permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------------ static analysis
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.16.10

      - name: ruff check
        run: ruff check . --output-format=github

      - name: ruff format --check
        run: ruff format --check .

  types:
    name: Types (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install the project
        run: pip install -e ".[dev]"

      - name: mypy
        run: mypy

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # gitleaks-action walks the pull request's commit history, which needs
    # `pull-requests: read`. Dependabot's token is read-only by default, so without this
    # every automated PR fails the scan with a 403 that looks exactly like a leaked secret
    # and is not one.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan only means something over the whole history, not just the tip.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------------- tests
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint, types]

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_POSTGRES_ASYNC_URI: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/taskhub_test
      TEST_POSTGRES_SYNC_URI: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/taskhub_test
      # The Redis *service* is reachable at 127.0.0.1; without these the cache-backed
      # tests silently skip and the Redis code paths go unmeasured.
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the project
        run: pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -U postgres; then exit 0; fi
            sleep 1
          done
          echo "PostgreSQL never became ready" && exit 1

      - name: Wait for Redis
        # `redis-cli` only exists inside the service container, not on the runner, so the
        # probe uses the client library the project already depends on.
        run: |
          python - <<'PY'
          import sys
          import time

          import redis

          client = redis.Redis(host="127.0.0.1", port=6379, socket_connect_timeout=1)
          for _ in range(30):
              try:
                  if client.ping():
                      print("redis is ready")
                      sys.exit(0)
              except redis.RedisError:
                  time.sleep(1)
          print("Redis never became ready")
          sys.exit(1)
          PY

      - name: Run the test suite
        # `--no-cov` on purpose. This job answers one question: does the code pass on every
        # supported interpreter? The coverage number is taken in the `Coverage gate` job,
        # on the only interpreter whose tracer can measure this code base honestly.
        run: pytest --no-cov

  # -------------------------------------------------------------------- coverage
  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [lint, types]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskhub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PYTHON_VERSION: "3.14"
      TEST_POSTGRES_ASYNC_URI: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/taskhub_test
      TEST_POSTGRES_SYNC_URI: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/taskhub_test
      # The Redis *service* is reachable at 127.0.0.1; without these the cache-backed
      # tests silently skip and the Redis code paths go unmeasured.
      REDIS_URL: redis://127.0.0.1:6379/0
      REDIS_CACHE_URL: redis://127.0.0.1:6379/1
      # Why this job is pinned to 3.14 and to PEP 669 `sys.monitoring`:
      #
      # * coverage.py's C tracer implements `sys.settrace`, and it loses the statement that
      #   follows every `await` in this code base. SQLAlchemy's async layer resumes those
      #   coroutines from a greenlet, and the tracer's per-thread frame bookkeeping does not
      #   survive the switch — so it reports whole repository methods and every endpoint's
      #   closing `return` as never executed. Measured on the same 280 tests: 84.1% instead
      #   of 91.1%, with `tests/integration/test_tasks.py` at 100% and the service it covers
      #   at 57%.
      # * `sys.monitoring` survives the greenlet switch, but its BRANCH_LEFT/BRANCH_RIGHT
      #   events only exist on Python 3.14, and this project measures branches. Hence one
      #   interpreter, pinned, rather than a gate that silently measures the wrong thing.
      #
      # A wrong-but-green coverage gate is worse than no gate, so the gate lives here and
      # the compatibility matrix above runs without measuring anything.
      COVERAGE_CORE: sysmon

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install the project
        run: pip install -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -U postgres; then exit 0; fi
            sleep 1
          done
          echo "PostgreSQL never became ready" && exit 1

      - name: Wait for Redis
        # `redis-cli` only exists inside the service container, not on the runner, so the
        # probe uses the client library the project already depends on.
        run: |
          python - <<'PY'
          import sys
          import time

          import redis

          client = redis.Redis(host="127.0.0.1", port=6379, socket_connect_timeout=1)
          for _ in range(30):
              try:
                  if client.ping():
                      print("redis is ready")
                      sys.exit(0)
              except redis.RedisError:
                  time.sleep(1)
          print("Redis never became ready")
          sys.exit(1)
          PY

      - name: Run the suite under the gate
        run: pytest --cov-fail-under=85 --cov-report=term-missing

      - name: The gate must run on the tracer that measures correctly
        run: |
          # A gate that measures the wrong tracer is worse than no gate, so the job fails
          # rather than reporting a number it cannot trust.
          resolved="$(coverage debug config | grep -E '^[[:space:]]*core:' | tr -d '[:space:]')"
          echo "resolved coverage config: $resolved"
          test "$resolved" = "core:sysmon" || {
            echo "::error::COVERAGE_CORE=sysmon was not honoured, so --cov-fail-under would judge a tracer that drops every line after an await"
            exit 1
          }

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  # -------------------------------------------------------------------- migrations
  migrations:
    name: Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskhub_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENVIRONMENT: testing
      SECRET_KEY: ci-secret-key-that-is-long-enough-for-ci-0123456789
      POSTGRES_ASYNC_URI: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/taskhub_ci
      POSTGRES_SYNC_URI: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/taskhub_ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Upgrade, downgrade, upgrade again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Models and migrations must agree
        run: alembic check

      - name: Autogenerate must find nothing to do
        run: |
          # `alembic revision --autogenerate` always writes a file; what matters is
          # whether it contains operations. An empty revision is the pass condition.
          alembic revision --autogenerate -m ci-drift-check
          revision="$(ls -t alembic/versions/*ci_drift_check*.py | head -n 1)"
          if grep -qE '^\s+op\.' "$revision"; then
            echo "::error::alembic autogenerate produced operations — commit a migration"
            sed -n '1,60p' "$revision"
            exit 1
          fi
          rm -f "$revision"
          echo "no drift"

  # ------------------------------------------------------------------- build image
  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: taskhub-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image must declare a healthcheck
        run: |
          test -n "$(docker inspect --format '{{json .Config.Healthcheck}}' taskhub-api:ci)" \
            || { echo "::error::no HEALTHCHECK in the image"; exit 1; }

      - name: The image must not run as root
        run: |
          user="$(docker inspect --format '{{.Config.User}}' taskhub-api:ci)"
          test "$user" != "0" && test -n "$user" \
            || { echo "::error::the runtime image runs as root"; exit 1; }

      - name: Import smoke check inside the image
        run: |
          docker run --rm --entrypoint python taskhub-api:ci -c "import app.main; print('imports ok')"

  # ------------------------------------------------------------------------ full stack
  stack:
    name: Compose stack (end to end)
    runs-on: ubuntu-latest
    needs: [lint, docker]
    # The claim "docker compose up gives you a working system" is the one thing this
    # repository could not verify for a long time: the machine it was written on has no
    # container runtime and no nested virtualisation. GitHub Actions runners do, so the
    # proof lives here instead of in a README footnote.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install the smoke test's only dependency
        # scripts/smoke.py is an HTTP client against a running server; it does not need the
        # application installed, only httpx.
        run: pip install httpx

      - name: Bring the stack up
        run: docker compose up -d --build --wait --wait-timeout 420

      - name: The migration container must have succeeded
        # `migrate` is a one-shot service. If it failed, every later service is starting
        # against a schema that does not exist, and `--wait` would still pass for them.
        # `--all` is load-bearing: `docker compose ps` lists running containers only, so
        # a container that exited 0 — the exact one this step inspects — is invisible
        # without it, and `docker inspect` then gets an empty ID and fails.
        run: |
          container_id="$(docker compose ps -q --all migrate)"
          test -n "$container_id" || {
            echo "::error::no migrate container to inspect"
            docker compose ps --all
            exit 1
          }
          state="$(docker inspect --format '{{.State.Status}} {{.State.ExitCode}}' "$container_id")"
          echo "migrate: $state"
          test "$state" = "exited 0" || {
            echo "::error::the migrate service did not exit 0"
            docker compose logs migrate
            exit 1
          }

      - name: The API must report itself ready
        run: |
          for attempt in $(seq 1 60); do
            body="$(curl -fsS http://127.0.0.1:8000/health/ready || true)"
            echo "attempt $attempt: $body"
            if echo "$body" | grep -q '"status":"ready"'; then
              # The schema check matters most here: this is a database that was created
              # empty a minute ago and brought up to date by the entrypoint.
              echo "$body" | grep -q '"schema":true' || {
                echo "::error::readiness does not report the schema as present"
                exit 1
              }
              exit 0
            fi
            sleep 2
          done
          echo "::error::the stack never became ready"
          docker compose logs api
          exit 1

      - name: The worker must have joined its queue
        # The API being healthy says nothing about the background half of the stack.
        run: |
          for attempt in $(seq 1 30); do
            # `sh -c` is the point: $HOSTNAME has to be expanded by a shell *inside* the
            # container. The runner's own shell would expand it to the runner's hostname,
            # so the destination named a node that does not exist and every attempt
            # timed out against a perfectly healthy worker.
            if docker compose exec -T worker sh -c \
              'celery -A app.core.celery_app:celery_app inspect ping -d "celery@$HOSTNAME"' \
              >/dev/null 2>&1; then
              echo "the worker answered ping"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the Celery worker never answered a ping"
          docker compose logs worker
          exit 1

      - name: Drive the running stack
        # 67 assertions over HTTP plus two more that need the worker and the mail sink:
        # assigning a task must produce an e-mail addressed to the assignee.
        run: python scripts/smoke.py --base-url http://127.0.0.1:8000 --mailpit-url http://127.0.0.1:8025

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 300

      - name: Tear down
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 30

  # ------------------------------------------------------------------- compose file
  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The compose file must be valid
        run: docker compose config --quiet