[project]
name = "taskhub-api"
version = "1.0.0"
description = "Database migrations for TaskHub API"
requires-python = ">=3.12"

# --------------------------------------------------------------------------------------
# Alembic
#   the URL is intentionally absent: `alembic/env.py` reads it from app.core.config so the
#   application and the migrations can never disagree about which database they target.
# --------------------------------------------------------------------------------------

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

# NOTE: no `post_write_hooks` here — migrations are formatted by `ruff format .`
# through pre-commit and CI, so the hook stays out of the critical path.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S