# =====================================================================================
# TaskHub — full stack for local development and for `docker compose up` demos.
#
#   api        FastAPI behind gunicorn/uvicorn workers
#   worker     Celery worker (default + notifications + maintenance queues)
#   beat       Celery beat (periodic sweeps)
#   postgres   database with a healthcheck
#   redis      cache + Celery broker + rate-limit counters
#   mailpit    catches every outgoing e-mail instead of sending it
#   nginx      TLS-terminating reverse proxy with gzip and security headers
#
# Profiles let you run slices of it:
#   docker compose up api worker beat          # just the application
#   docker compose --profile observability up  # + prometheus and grafana
# =====================================================================================

name: taskhub

x-api-env: &api-env
  ENVIRONMENT: local
  DEBUG: "false"
  LOG_LEVEL: INFO
  LOG_JSON: "true"
  SECRET_KEY: ${SECRET_KEY:-change-me-in-production-with-32-plus-characters}
  POSTGRES_SERVER: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: taskhub
  POSTGRES_USER: taskhub
  POSTGRES_PASSWORD: taskhub
  POSTGRES_ASYNC_URI: postgresql+asyncpg://taskhub:taskhub@postgres:5432/taskhub
  POSTGRES_SYNC_URI: postgresql+psycopg://taskhub:taskhub@postgres:5432/taskhub
  REDIS_URL: redis://redis:6379/0
  REDIS_CACHE_URL: redis://redis:6379/1
  CELERY_BROKER_URL: redis://redis:6379/2
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  CELERY_TASK_ALWAYS_EAGER: "false"
  CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
  ALLOWED_HOSTS: '["*"]'
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS: "120"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  FIRST_SUPERUSER_EMAIL: ${FIRST_SUPERUSER_EMAIL:-admin@taskhub.dev}
  FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:-Admin123!}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: taskhub
      POSTGRES_PASSWORD: taskhub
      POSTGRES_DB: taskhub
      # Deterministic collation so index behaviour does not depend on the host locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskhub -d taskhub"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      # Cache entries are disposable; evict the least recently used one first.
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    restart: unless-stopped

  migrate:
    build:
      context: .
      target: runtime
    image: taskhub-api:latest
    environment: *api-env
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: runtime
    image: taskhub-api:latest
    environment:
      <<: *api-env
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: runtime
    image: taskhub-api:latest
    environment:
      <<: *api-env
      CELERY_QUEUES: default,notifications,maintenance
      CELERY_CONCURRENCY: "4"
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # CMD-SHELL, not CMD: the destination needs a shell to expand $HOSTNAME. In exec
      # form the literal string "celery@$HOSTNAME" is sent as the destination, no node
      # ever matches, and the probe fails forever even though the worker is ready.
      # `--timeout 10` also gives the reply time to arrive on a loaded CI runner.
      test:
        - CMD-SHELL
        - >-
          celery -A app.core.celery_app:celery_app inspect ping
          --timeout 10 -d celery@$$HOSTNAME | grep -q pong
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  beat:
    build:
      context: .
      target: runtime
    image: taskhub-api:latest
    environment: *api-env
    command: ["beat"]
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      # Beat publishes no worker node, so `celery inspect` cannot see it. The entrypoint
      # execs beat, so PID 1 is the beat process and its command line is the honest
      # liveness signal; if it dies the container exits and `restart` replaces it.
      test: ["CMD-SHELL", "grep -aq beat /proc/1/cmdline"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: ["observability"]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
  grafana-data: