[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taskhub-api"
version = "1.0.0"
description = "TaskHub — production-grade async FastAPI + PostgreSQL service for task and project management"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "TaskHub" }]
keywords = ["fastapi", "postgresql", "async", "docker", "celery", "redis", "backend"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "greenlet>=3.1.0",
    "pyjwt[crypto]>=2.9.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.17",
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
    "httpx>=0.27.0",
    "email-validator>=2.2.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "factory-boy>=3.3.1",
    "faker>=33.0.0",
    "freezegun>=1.5.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-redis",
    "pre-commit>=4.0.1",
    "anyio>=4.6.0",
]

[project.urls]
Homepage = "https://github.com/OWNER/taskhub-api"
Repository = "https://github.com/OWNER/taskhub-api"
Issues = "https://github.com/OWNER/taskhub-api/issues"

[project.scripts]
taskhub = "app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["/app", "/tests", "/alembic", "/docker", "/README.md"]

# --------------------------------------------------------------------------------------
# pytest
# --------------------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov=tests",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=85",
]
asyncio_mode = "auto"
# One event loop for the whole session: the async engine is a process-wide singleton, so a
# per-test loop would leave pooled connections bound to a closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "unit: isolated business-logic tests, no database required",
    "integration: tests that touch the database or Redis",
    "slow: tests that intentionally sleep (cache expiry, rate limits)",
]
filterwarnings = ["error", "ignore::DeprecationWarning:celery.*"]

# --------------------------------------------------------------------------------------
# coverage
# --------------------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/cli.py", "app/workers/celery_app.py"]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]

# --------------------------------------------------------------------------------------
# ruff — single tool for linting and formatting
# --------------------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "ASYNC",     # flake8-async
    "S",         # flake8-bandit
    "C4",        # flake8-comprehensions
    "DTZ",       # flake8-datetimez
    "T20",       # flake8-print
    "SIM",       # flake8-simplify
    "PTH",       # flake8-use-pathlib
    "RUF",       # ruff-specific
    "B",         # flake8-bugbear
    "A",         # flake8-builtins
    "C90",       # mccabe
    "PT",        # flake8-pytest-style
    "RET",       # flake8-return
    "ARG",       # flake8-unused-arguments
    "PL",        # pylint subset
    "TRY",       # tryceratops
    "FAST",      # fastapi-lint-ish rules
]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # FastAPI Depends() in defaults is the documented pattern
    "TRY003",  # long messages inside custom exceptions are intentional
    "EM101", "EM102",
    "ANN401",
    # Lazy imports are a deliberate pattern here: `celery`, `redis` and the CLI helpers
    # must stay out of the request path, and a couple of modules would otherwise form an
    # import cycle. Every other lint rule stays on.
    "PLC0415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",    # assert is the point of a test
    "S105", "S106", "S107",  # fixture credentials
    "PLR2004", # literal status codes and thresholds read better inline
    "ARG001", "ARG002",
    "PLR0913", "PLR0917", "C901", "PT011", "BLE001", "PLC2701",
]
"alembic/**" = ["E402", "I001", "ARG001"]  # the hook signature is fixed by Alembic
"app/cli.py" = ["T201"]            # a CLI prints its result
"app/api/errors.py" = ["ARG001"]   # exception handlers must accept the exception
"app/workers/tasks/**" = ["ARG001"]  # Celery passes the bound task as `self`
"scripts/**" = ["T201", "PLR2004", "S101", "S105", "C901", "BLE001", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.lint.mccabe]
# `make_listing` in the task repository builds a query out of eleven independent
# filters; splitting it would hide exactly the mapping that makes it readable.
max-complexity = 14

[tool.ruff.lint.pylint]
max-args = 12
max-positional-args = 12

[tool.ruff.lint.flake8-unused-arguments]
# `_current_user: CurrentUser` is a dependency with no use in the body — that is how a
# route declares "this endpoint requires authentication" without pulling in a session.
ignore-variadic-names = true

# --------------------------------------------------------------------------------------
# mypy
# --------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["app", "tests"]
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
# Celery's task decorator and its signal connectors are untyped, so mypy cannot
# describe the functions they wrap. The decorators themselves stay; only the resulting
# `untyped-decorator` complaint is silenced.
module = ["celery.*", "faker.*", "factory.*", "prometheus_client.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.*", "app.core.celery_app"]
disable_error_code = ["untyped-decorator"]

# --------------------------------------------------------------------------------------
# tests are still fully type-checked, but fixture plumbing is allowed to be pragmatic:
# a test that returns `dict[str, object]` from a helper and then indexes into it is
# normal, and `Any` in an assertion is clearer than a cast.
# --------------------------------------------------------------------------------------
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false