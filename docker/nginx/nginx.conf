# =====================================================================================
# Reverse proxy in front of the API.
#
# It does the things an application container should not: compression, request size
# limits, security headers and access logs with timings. TLS termination is commented
# out because it needs a certificate; point it at a mounted cert to enable.
# =====================================================================================

upstream taskhub_api {
    server api:8000;
    keepalive 32;
}

# Rate limiting lives in the application (it needs the caller's identity), so this layer
# only guards against a gross flood.
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # 1 MB is far above any legitimate payload for this API.
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    # SAMEORIGIN (not DENY): the Swagger UI is served from this origin and embeds an
    # iframe-free page that still needs to be allowed to frame itself.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        application/json
        application/javascript
        application/rss+xml
        application/xml
        image/svg+xml
        text/css
        text/plain
        text/xml;

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    location /health/ {
        proxy_pass http://taskhub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location = /metrics {
        proxy_pass http://taskhub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Metrics should never be public. Uncomment together with your own network rules:
        # allow 10.0.0.0/8;
        # deny all;
    }

    location / {
        limit_req zone=api burst=50 nodelay;

        proxy_pass http://taskhub_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Stream JSON responses straight through instead of buffering them.
        proxy_buffering off;
    }
}

log_format main
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'rt=$request_time urt=$upstream_response_time';